[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-intensity-tool"
version = "0.1.0"
description = "Retrieves and processes UK electricity generation data from the Carbon Intensity API."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
carbon-intensity = "carbon_intensity.application:main"

[tool.setuptools.packages.find]
where = ["src"]
